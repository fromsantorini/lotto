<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 분석</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1424;
      --surface: #1a2138;
      --raised: #313b5f;
      --text: #eef1f8;
      --muted: #9aa5bf;
      --line: rgba(255, 255, 255, .08);
      --gold: #f5c451;
      --danger: #ff9a9a;
      --ball-size: 36px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: radial-gradient(1000px 420px at 50% -120px, rgba(245, 196, 81, .10), transparent 70%) no-repeat, var(--bg);
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; }
    h2 { margin: 0; font-size: 20px; }
    h3 { margin: 0 0 12px; font-size: 15px; }

    .muted, .status-panel { color: var(--muted); font-size: 14px; }
    .status-panel.error { color: var(--danger); }

    button, input, select { font: inherit; }

    button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--raised);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .view-tabs {
      display: flex;
      gap: 4px;
      margin-top: 18px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      touch-action: manipulation;
    }

    .tab-button {
      flex: 0 0 auto;
      min-height: 44px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: none;
      color: var(--muted);
      font-weight: 600;
    }

    .tab-button.active { border-bottom-color: var(--gold); color: var(--gold); }

    .view { display: none; }
    .view.active { display: block; }

    .panel {
      margin-top: 16px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .panel:empty { display: none; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .balls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ball {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--ball-size);
      height: var(--ball-size);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 26%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 46%), var(--ball-color);
      box-shadow: inset -2px -3px 6px rgba(0, 0, 0, .25), 0 3px 8px rgba(0, 0, 0, .35);
      color: #fff;
      font-size: calc(var(--ball-size) * .4);
      font-weight: 800;
    }

    .n1 { --ball-color: #f5b921; color: #1b1f2a; }
    .n2 { --ball-color: #2f7fea; }
    .n3 { --ball-color: #df4249; }
    .n4 { --ball-color: #6d7789; }
    .n5 { --ball-color: #21935b; }

    .ball-plus { color: var(--muted); font-size: 18px; font-weight: 700; }

    .ball.hit { outline: 2px solid var(--gold); outline-offset: 1px; box-shadow: 0 0 14px rgba(245, 196, 81, .7); }
    .ball.bonus-hit { outline: 2px solid #b79cff; outline-offset: 1px; box-shadow: 0 0 14px rgba(183, 156, 255, .7); }
    .balls.scored .ball:not(.hit):not(.bonus-hit) { opacity: .32; box-shadow: none; }

    .hero-panel {
      --ball-size: clamp(34px, 9.4vw, 62px);
      background: linear-gradient(135deg, #27315a 0%, var(--surface) 70%);
    }

    .hero-panel .ball {
      box-shadow: inset -3px -4px 8px rgba(0, 0, 0, .25), 0 0 22px color-mix(in srgb, var(--ball-color) 55%, transparent);
    }

    .hero-stats {
      display: flex;
      gap: 32px;
      margin-top: 20px;
    }

    .hero-stats span { display: block; color: var(--muted); font-size: 13px; }
    .hero-stats strong { font-size: 22px; color: var(--gold); }

    .briefing-grid, .latest-follow-grid, .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .grid + .grid { margin-top: 12px; }

    .briefing-card, .latest-follow-card, .metric {
      min-width: 0;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
    }

    .briefing-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .follow-card { grid-column: 1 / -1; }

    .follow-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px 18px;
    }

    .inline-ball-list {
      --ball-size: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    .follow-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .follow-head h3 { margin: 0; flex: 1; }

    .stat-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .latest-follow-card .stat-pills { margin-top: 12px; }

    .stat-pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--raised);
      color: #cdd5e7;
      font-size: 13px;
      font-weight: 500;
    }

    .stat-pill.warn { color: var(--gold); }

    .rec-group {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .rec-group:first-child { padding-top: 0; border-top: 0; }

    .rec-group h3 {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 0;
      min-height: 36px;
      color: var(--gold);
    }

    .rec-sets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 10px 18px;
    }

    details > summary { cursor: pointer; }

    .fold { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .fold > summary { color: var(--muted); font-size: 14px; }
    .fold h3 { margin: 18px 0 8px; color: var(--muted); font-size: 13px; }
    .fold details { margin-top: 10px; }
    .fold details > summary { color: var(--muted); font-size: 13px; }
    .fold .table-wrap { margin-top: 10px; }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .score-tile {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
    }

    .score-tile span, .score-tile small { color: var(--muted); font-size: 13px; }
    .score-tile strong { color: var(--gold); font-size: 30px; line-height: 1.2; }

    .history-batch-list { display: grid; gap: 8px; margin-top: 18px; }

    .history-batch {
      --ball-size: 28px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
    }

    .history-batch > summary {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      list-style: none;
    }

    .history-batch > summary::-webkit-details-marker { display: none; }
    .batch-round { font-weight: 700; }
    .batch-best { margin-left: auto; }

    .score-rows { padding: 0 14px 12px; }

    .score-row {
      display: grid;
      grid-template-columns: minmax(84px, 150px) 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
    }

    .rec-label { color: var(--muted); font-size: 13px; }
    .hit-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .hit-count.won { color: var(--gold); font-weight: 700; }

    .metric-value { margin: 0; color: var(--gold); font-size: 26px; font-weight: 800; }
    .metric-value + .muted { margin: 2px 0 0; }

    .kv { margin: 0; }

    .kv div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .kv div:first-child { border-top: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 600; text-align: right; }
    .kv + .balls, .kv + .mini-bars, .mini-bars + .stat-pills { margin-top: 12px; }

    .mini-bars { display: grid; gap: 8px; }

    .mini-bar {
      display: grid;
      grid-template-columns: 48px minmax(24px, 1fr) auto;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .mini-bar span:last-child { color: var(--muted); }

    .bar-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c8922b, var(--gold));
    }

    .form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    input, select {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--raised);
      color: var(--text);
    }

    input[type="search"] { width: min(100%, 280px); }

    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }

    table { width: 100%; min-width: 640px; border-collapse: collapse; }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th { color: var(--muted); font-size: 13px; font-weight: 600; }
    tr:last-child td, tr:last-child th { border-bottom: 0; }
    #historyPanel { --ball-size: 30px; }
    #historyPanel h2 { margin-bottom: 14px; }

    @media (max-width: 640px) {
      .app-shell { width: calc(100% - 32px); padding-top: 20px; }
      .panel { padding: 18px; }
      .briefing-grid { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rec-group { grid-template-columns: 1fr; gap: 8px; }
      .rec-group h3 { min-height: 0; }
      .rec-sets { grid-template-columns: 1fr; }
      .score-row { grid-template-columns: 1fr auto; }
      .score-row .balls { grid-column: 1 / -1; grid-row: 2; }
      table { min-width: 600px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>로또 번호 분석</h1>
      <div class="topbar-side">
        <span id="statusPanel" class="status-panel" role="status"></span>
        <button id="refreshButton" type="button">새로고침</button>
      </div>
    </header>

    <nav class="view-tabs" aria-label="화면 선택">
      <button class="tab-button active" type="button" data-view="dashboard">대시보드</button>
      <button class="tab-button" type="button" data-view="stats">통계</button>
      <button class="tab-button" type="button" data-view="history">역대 당첨번호</button>
    </nav>

    <div id="dashboardView" class="view active">
      <section id="latestPanel" class="panel hero-panel"></section>
      <section id="briefingPanel" class="panel briefing-panel"></section>
      <section id="recommendPanel" class="panel"></section>
      <section id="lstmScorePanel" class="panel"></section>
    </div>

    <div id="statsView" class="view">
      <section id="statsPanel" class="panel"></section>
      <section id="followerStatsPanel" class="panel"></section>
      <section id="significancePanel" class="panel"></section>
    </div>

    <div id="historyView" class="view">
      <section id="historyPanel" class="panel"></section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "lotto-dashboard:v1";
    const DATA_URL = "lotto-data.json";
    const LSTM_URL = "lstm-prediction.json";
    const LSTM_HISTORY_URL = "lstm-prediction-history.json";

    const defaultState = {
      schemaVersion: 2,
      updatedAt: null,
      preferences: {
        statWindow: 100,
        historyLimit: 50,
        historyQuery: ""
      }
    };

    let appState = loadState();
    let drawData = {
      schemaVersion: 1,
      source: "not-loaded",
      updatedAt: null,
      latestRound: 0,
      draws: []
    };
    let currentLoadStatus = { title: "데이터 준비" };
    let lstmPrediction = null;
    let lstmHistory = [];

    function cloneDefaultState() {
      return JSON.parse(JSON.stringify(defaultState));
    }

    function normalizeDraw(draw) {
      return {
        round: Number(draw.round),
        date: String(draw.date || ""),
        numbers: (draw.numbers || []).map(Number).slice(0, 6).sort((a, b) => a - b),
        bonus: Number(draw.bonus),
        firstPrizeAmount: Number(draw.firstPrizeAmount || 0),
        firstWinnerCount: Number(draw.firstWinnerCount || 0),
        totalSellAmount: Number(draw.totalSellAmount || 0)
      };
    }

    function isValidDraw(draw) {
      return Number.isInteger(draw.round)
        && draw.round > 0
        && Array.isArray(draw.numbers)
        && draw.numbers.length === 6
        && new Set(draw.numbers).size === 6
        && draw.numbers.every((number) => Number.isInteger(number) && number >= 1 && number <= 45)
        && Number.isInteger(draw.bonus)
        && draw.bonus >= 1
        && draw.bonus <= 45;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return cloneDefaultState();
        const parsed = JSON.parse(raw);
        if (![1, 2].includes(parsed.schemaVersion)) return cloneDefaultState();
        const defaults = cloneDefaultState();
        return {
          ...defaults,
          preferences: { ...defaults.preferences, ...(parsed.preferences || {}) }
        };
      } catch (error) {
        console.warn("storage_load_failed", error);
        return cloneDefaultState();
      }
    }

    function saveState(nextState) {
      const stateToSave = {
        schemaVersion: 2,
        ...nextState,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
      return stateToSave;
    }

    async function loadDrawData() {
      const response = await fetch(DATA_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`data_fetch_http_${response.status}`);
      const data = await response.json();
      if (data.schemaVersion !== 1 || !Array.isArray(data.draws)) {
        throw new Error("data_schema_invalid");
      }
      const draws = data.draws.map(normalizeDraw).filter(isValidDraw);
      if (draws.length === 0) throw new Error("data_draws_empty");
      return {
        schemaVersion: 1,
        source: String(data.source || "unknown"),
        updatedAt: data.updatedAt || null,
        latestRound: draws.reduce((max, draw) => Math.max(max, draw.round), 0),
        draws: draws.sort((a, b) => b.round - a.round)
      };
    }

    function finiteNumber(value) {
      return typeof value === "number" && Number.isFinite(value) ? value : null;
    }

    function evaluationNumber(value, digits = 3) {
      return finiteNumber(value) === null ? "-" : value.toFixed(digits);
    }

    function evaluationInterval(interval) {
      return Array.isArray(interval) && interval.length === 2
        && interval.every((value) => finiteNumber(value) !== null) && interval[0] <= interval[1]
        ? interval.map((value) => value.toFixed(3)).join(" ~ ") : "-";
    }

    async function loadLstmPrediction() {
      try {
        const response = await fetch(LSTM_URL, { cache: "no-store" });
        if (!response.ok) return null;
        const data = await response.json();
        if (data.schemaVersion !== 2 || !Array.isArray(data.recommendations)) return null;

        const recommendations = data.recommendations
          .map((rec) => ({
            method: String(rec.method || "lstm"),
            numbers: Array.isArray(rec.numbers) ? rec.numbers.map(Number) : [],
          }))
          .filter((rec) =>
            rec.numbers.length === 6
            && new Set(rec.numbers).size === 6
            && rec.numbers.every((number) => Number.isInteger(number) && number >= 1 && number <= 45)
          )
          .map((rec) => ({ ...rec, numbers: [...rec.numbers].sort((a, b) => a - b) }));

        if (recommendations.length === 0) return null;

        return {
          model: String(data.model || "lstm"),
          sourceLatestRound: Number(data.sourceLatestRound || 0),
          targetRound: Number(data.targetRound || 0),
          trainedAt: data.trainedAt || null,
          stateful: data.stateful === true,
          epochs: finiteNumber(data.epochs),
          numberScores: Array.isArray(data.numberScores) && data.numberScores.length === 45
            && data.numberScores.every((score) => finiteNumber(score) !== null && score >= 0 && score <= 1)
            ? data.numberScores : null,
          recommendations,
          comparison: ["chronological-holdout-v2", "chronological-stateful-holdout-v3"].includes(data.comparison?.evaluationMode)
            && Array.isArray(data.comparison.methods) ? data.comparison : null,
          backtest: data.backtest && typeof data.backtest === "object" ? {
            metric: String(data.backtest.metric || ""),
            threePlusRate: finiteNumber(data.backtest.threePlusRate),
            differenceCI95: data.backtest.differenceCI95,
            testedRounds: Number(data.backtest.testedRounds || 0),
            selectedMethod: String(data.backtest.selectedMethod || "uniform"),
            selectedWindow: data.backtest.selectedWindow == null
              ? null : Number(data.backtest.selectedWindow),
            selectedHalfLife: data.backtest.selectedHalfLife == null
              ? null : Number(data.backtest.selectedHalfLife),
            meanMatches: finiteNumber(data.backtest.meanMatches),
            randomBaseline: finiteNumber(data.backtest.randomBaseline)
          } : null
        };
      } catch (error) {
        console.warn("lstm_prediction_load_failed", error);
        return null;
      }
    }

    async function loadLstmHistory() {
      try {
        const response = await fetch(LSTM_HISTORY_URL, { cache: "no-store" });
        if (!response.ok) return [];
        const data = await response.json();
        if (data.schemaVersion !== 1 || !Array.isArray(data.entries)) return [];
        return data.entries
          .filter((entry) => Number.isInteger(entry.targetRound) && Array.isArray(entry.recommendations))
          .sort((a, b) => b.targetRound - a.targetRound);
      } catch (error) {
        console.warn("lstm_history_load_failed", error);
        return [];
      }
    }

    function getBallClass(number) {
      if (number <= 10) return "n1";
      if (number <= 20) return "n2";
      if (number <= 30) return "n3";
      if (number <= 40) return "n4";
      return "n5";
    }

    function sumNumbers(numbers) {
      return numbers.reduce((total, number) => total + number, 0);
    }

    function countOddEven(numbers) {
      const odd = numbers.filter((number) => number % 2 === 1).length;
      return { odd, even: numbers.length - odd };
    }

    function countLowHigh(numbers) {
      const low = numbers.filter((number) => number <= 22).length;
      return { low, high: numbers.length - low };
    }

    function createEmptyFrequency() {
      return Array.from({ length: 45 }, (_, index) => ({
        number: index + 1,
        count: 0,
        bonusCount: 0
      }));
    }

    function calculateStats(draws, limit = draws.length) {
      const selectedDraws = draws.slice(0, limit);
      const frequency = createEmptyFrequency();
      const sums = [];
      let oddTotal = 0;
      let evenTotal = 0;
      let lowTotal = 0;
      let highTotal = 0;

      selectedDraws.forEach((draw) => {
        draw.numbers.forEach((number) => {
          frequency[number - 1].count += 1;
        });
        frequency[draw.bonus - 1].bonusCount += 1;

        const oddEven = countOddEven(draw.numbers);
        const lowHigh = countLowHigh(draw.numbers);
        oddTotal += oddEven.odd;
        evenTotal += oddEven.even;
        lowTotal += lowHigh.low;
        highTotal += lowHigh.high;
        sums.push(sumNumbers(draw.numbers));
      });

      const drawCount = selectedDraws.length || 1;
      return {
        drawCount: selectedDraws.length,
        frequency,
        hotNumbers: [...frequency].sort((a, b) => b.count - a.count || a.number - b.number).slice(0, 10),
        coldNumbers: [...frequency].sort((a, b) => a.count - b.count || a.number - b.number).slice(0, 10),
        averageOdd: oddTotal / drawCount,
        averageEven: evenTotal / drawCount,
        averageLow: lowTotal / drawCount,
        averageHigh: highTotal / drawCount,
        averageSum: sums.length ? sums.reduce((a, b) => a + b, 0) / sums.length : 0,
        minSum: sums.length ? Math.min(...sums) : 0,
        maxSum: sums.length ? Math.max(...sums) : 0
      };
    }

    function getPrizeTier(matchCount, bonusMatched) {
      if (matchCount === 6) return "1등";
      if (matchCount === 5 && bonusMatched) return "2등";
      if (matchCount === 5) return "3등";
      if (matchCount === 4) return "4등";
      if (matchCount === 3) return "5등";
      return "낙첨";
    }

    function parseNumberInput(value) {
      const numbers = value
        .split(/[,\s]+/)
        .map((token) => token.trim())
        .filter(Boolean)
        .map(Number);

      const unique = [...new Set(numbers)];
      const invalid = unique.filter((number) => !Number.isInteger(number) || number < 1 || number > 45);
      if (invalid.length > 0) return { ok: false, error: "번호는 1부터 45 사이여야 합니다.", numbers: [] };
      if (unique.length === 0) return { ok: false, error: "분석할 번호를 입력하세요.", numbers: [] };
      return { ok: true, error: "", numbers: unique };
    }

    function drawMatchesPattern(draw, numbers, mode) {
      if (mode === "all") return numbers.every((number) => draw.numbers.includes(number));
      return numbers.some((number) => draw.numbers.includes(number));
    }

    function analyzeNextDraws(draws, numbers, mode) {
      const byRound = new Map(draws.map((draw) => [draw.round, draw]));
      const matchedBaseDraws = draws
        .filter((draw) => drawMatchesPattern(draw, numbers, mode))
        .sort((a, b) => a.round - b.round);
      const nextDraws = matchedBaseDraws
        .map((draw) => byRound.get(draw.round + 1))
        .filter(Boolean)
        .sort((a, b) => b.round - a.round);

      return {
        inputNumbers: numbers,
        mode,
        matchedBaseDraws,
        nextDraws,
        stats: calculateStats(nextDraws, nextDraws.length)
      };
    }

    function analyzeLatestNumberFollowers(draws, recentLimit = Number.POSITIVE_INFINITY) {
      const latest = draws[0];
      if (!latest) return [];

      const byRound = new Map(draws.map((draw) => [draw.round, draw]));
      return latest.numbers.map((number) => {
        const allMatchedPairs = draws
          .filter((draw) => draw.round !== latest.round && draw.numbers.includes(number))
          .map((draw) => ({
            baseDraw: draw,
            nextDraw: byRound.get(draw.round + 1)
          }))
          .filter((item) => item.nextDraw)
          .sort((a, b) => b.baseDraw.round - a.baseDraw.round);

        const matchedPairs = Number.isFinite(recentLimit)
          ? allMatchedPairs.slice(0, recentLimit)
          : allMatchedPairs;

        const nextDraws = matchedPairs.map((item) => item.nextDraw);
        const stats = calculateStats(nextDraws, nextDraws.length);
        const topNextNumbers = [...stats.frequency]
          .filter((item) => item.count > 0)
          .sort((a, b) => b.count - a.count || a.number - b.number)
          .slice(0, 6);
        const repeatedLatestNumbers = topNextNumbers
          .filter((item) => latest.numbers.includes(item.number))
          .map((item) => item.number);
        // 기준 회차가 최신 6개와 많이 겹칠수록 그 다음 회차 번호를 크게 반영한다.
        const weightedScores = new Map();
        matchedPairs.forEach(({ baseDraw, nextDraw }) => {
          const weight = baseDraw.numbers.filter((item) => latest.numbers.includes(item)).length;
          nextDraw.numbers.forEach((item) => weightedScores.set(item, (weightedScores.get(item) || 0) + weight));
        });
        const weightedTopNumbers = [...weightedScores]
          .sort((a, b) => b[1] - a[1] || a[0] - b[0])
          .slice(0, 3)
          .map(([item]) => item);

        return {
          number,
          sampleCount: matchedPairs.length,
          sampleLimit: recentLimit,
          matchedPairs,
          nextDraws,
          stats,
          topNextNumbers,
          repeatedLatestNumbers,
          weightedTopNumbers
        };
      });
    }

    function expectedMainNumberCount(drawCount) {
      return drawCount * (6 / 45);
    }

    function zScore(observed, expected, probability) {
      const variance = expected * (1 - probability);
      if (variance <= 0) return 0;
      return (observed - expected) / Math.sqrt(variance);
    }

    function approximateTwoTailedPValue(z) {
      const x = Math.abs(z);
      const t = 1 / (1 + 0.2316419 * x);
      const d = 0.3989423 * Math.exp(-x * x / 2);
      const probability = d * t * (
        0.3193815
        + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))
      );
      return Math.min(1, Math.max(0, 2 * probability));
    }

    function significanceLabel(pValue, sampleCount) {
      if (sampleCount < 100) return "표본 부족";
      if (pValue < 0.01) return "강한 편차";
      if (pValue < 0.05) return "눈에 띄는 편차";
      return "무작위 범위";
    }

    function analyzeNumberFrequencySignificance(draws) {
      const stats = calculateStats(draws, draws.length);
      const expected = expectedMainNumberCount(stats.drawCount);
      const probability = 6 / 45;

      return stats.frequency.map((item) => {
        const z = zScore(item.count, expected, probability);
        const pValue = approximateTwoTailedPValue(z);
        return {
          number: item.number,
          observed: item.count,
          expected,
          z,
          pValue,
          label: significanceLabel(pValue, stats.drawCount)
        };
      }).sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
    }

    function analyzePairCooccurrence(draws) {
      const pairCounts = new Map();
      draws.forEach((draw) => {
        draw.numbers.forEach((a, index) => {
          draw.numbers.slice(index + 1).forEach((b) => {
            const key = `${a}-${b}`;
            pairCounts.set(key, (pairCounts.get(key) || 0) + 1);
          });
        });
      });

      const expected = draws.length * (15 / 990);
      return [...pairCounts.entries()].map(([key, count]) => {
        const z = zScore(count, expected, 15 / 990);
        const pValue = approximateTwoTailedPValue(z);
        return {
          pair: key.split("-").map(Number),
          observed: count,
          expected,
          z,
          pValue,
          label: significanceLabel(pValue, draws.length)
        };
      }).sort((a, b) => Math.abs(b.z) - Math.abs(a.z)).slice(0, 10);
    }

    function analyzeStructuralPatterns(draws) {
      const consecutiveCount = draws.filter((draw) => (
        draw.numbers.some((number, index, numbers) => index > 0 && number === numbers[index - 1] + 1)
      )).length;
      const sums = draws.map((draw) => sumNumbers(draw.numbers));
      return {
        drawCount: draws.length,
        consecutiveCount,
        consecutiveRate: draws.length ? consecutiveCount / draws.length : 0,
        averageSum: sums.length ? sums.reduce((a, b) => a + b, 0) / sums.length : 0,
        minSum: sums.length ? Math.min(...sums) : 0,
        maxSum: sums.length ? Math.max(...sums) : 0
      };
    }

    function analyzeLastDigitPatterns(draws, recentLimit = 5) {
      const digitCounts = Array.from({ length: 10 }, (_, digit) => ({
        digit,
        count: 0,
        recentCount: 0,
        duplicateTwoPlusDraws: 0,
        duplicateThreePlusDraws: 0
      }));
      const recentDraws = draws.slice(0, recentLimit);

      draws.forEach((draw) => {
        const perDraw = new Map();
        draw.numbers.forEach((number) => {
          const digit = number % 10;
          digitCounts[digit].count += 1;
          perDraw.set(digit, (perDraw.get(digit) || 0) + 1);
        });
        perDraw.forEach((count, digit) => {
          if (count >= 2) digitCounts[digit].duplicateTwoPlusDraws += 1;
          if (count >= 3) digitCounts[digit].duplicateThreePlusDraws += 1;
        });
      });

      recentDraws.forEach((draw) => {
        draw.numbers.forEach((number) => {
          digitCounts[number % 10].recentCount += 1;
        });
      });

      return {
        recentLimit,
        digits: digitCounts.map((item) => ({
          ...item,
          share: draws.length ? item.count / (draws.length * 6) : 0,
          recentShare: recentDraws.length ? item.recentCount / (recentDraws.length * 6) : 0
        })),
        topDigits: [...digitCounts].sort((a, b) => b.count - a.count).slice(0, 5),
        recentStrongDigits: digitCounts
          .map((item) => ({
            digit: item.digit,
            delta: (recentDraws.length ? item.recentCount / (recentDraws.length * 6) : 0)
              - (draws.length ? item.count / (draws.length * 6) : 0)
          }))
          .sort((a, b) => b.delta - a.delta)
          .slice(0, 5)
      };
    }

    function getConsecutiveRuns(numbers) {
      const sorted = [...numbers].sort((a, b) => a - b);
      const runs = [];
      let current = [sorted[0]];

      for (let index = 1; index < sorted.length; index += 1) {
        if (sorted[index] === sorted[index - 1] + 1) {
          current.push(sorted[index]);
        } else {
          if (current.length >= 2) runs.push(current);
          current = [sorted[index]];
        }
      }
      if (current.length >= 2) runs.push(current);
      return runs;
    }

    function analyzeConsecutivePatterns(draws, recentLimit = 100) {
      const pairCounts = new Map();
      const summary = { twoPlus: 0, threePlus: 0, fourPlus: 0 };
      const recentDraws = draws.slice(0, recentLimit);
      let recentTwoPlus = 0;

      draws.forEach((draw) => {
        const runs = getConsecutiveRuns(draw.numbers);
        if (runs.some((run) => run.length >= 2)) summary.twoPlus += 1;
        if (runs.some((run) => run.length >= 3)) summary.threePlus += 1;
        if (runs.some((run) => run.length >= 4)) summary.fourPlus += 1;

        runs.forEach((run) => {
          for (let index = 1; index < run.length; index += 1) {
            const key = `${run[index - 1]}-${run[index]}`;
            pairCounts.set(key, (pairCounts.get(key) || 0) + 1);
          }
        });
      });

      recentDraws.forEach((draw) => {
        if (getConsecutiveRuns(draw.numbers).some((run) => run.length >= 2)) recentTwoPlus += 1;
      });

      const overallTwoPlusRate = draws.length ? summary.twoPlus / draws.length : 0;
      const recentTwoPlusRate = recentDraws.length ? recentTwoPlus / recentDraws.length : 0;
      const trendRatio = overallTwoPlusRate > 0 ? recentTwoPlusRate / overallTwoPlusRate : 0;
      const estimatedNextRate = overallTwoPlusRate > 0
        ? Math.min(1, Math.max(0, overallTwoPlusRate * trendRatio))
        : recentTwoPlusRate;

      return {
        recentLimit,
        summary,
        overallTwoPlusRate,
        recentTwoPlusRate,
        trendRatio,
        estimatedNextRate,
        topPairs: [...pairCounts.entries()]
          .map(([key, count]) => ({ pair: key.split("-").map(Number), count }))
          .sort((a, b) => b.count - a.count)
          .slice(0, 10)
      };
    }

    function analyzeNeighborFollowers(draws) {
      const byRound = new Map(draws.map((draw) => [draw.round, draw]));
      const neighborCounts = new Map();
      let baseCount = 0;
      let matchedNextDrawCount = 0;

      draws.forEach((draw) => {
        const nextDraw = byRound.get(draw.round + 1);
        if (!nextDraw) return;
        baseCount += 1;

        const hits = new Set();
        draw.numbers.forEach((number) => {
          [number - 1, number + 1]
            .filter((candidate) => candidate >= 1 && candidate <= 45)
            .forEach((candidate) => {
              if (nextDraw.numbers.includes(candidate)) {
                hits.add(candidate);
                neighborCounts.set(candidate, (neighborCounts.get(candidate) || 0) + 1);
              }
            });
        });

        if (hits.size > 0) matchedNextDrawCount += 1;
      });

      return {
        baseCount,
        matchedNextDrawCount,
        hitRate: baseCount ? matchedNextDrawCount / baseCount : 0,
        topNeighbors: [...neighborCounts.entries()]
          .map(([number, count]) => ({ number, count }))
          .sort((a, b) => b.count - a.count || a.number - b.number)
          .slice(0, 10)
      };
    }

    function analyzeCarryOver(draws) {
      const byRound = new Map(draws.map((draw) => [draw.round, draw]));
      const distribution = [0, 0, 0, 0]; // 겹침 0개 / 1개 / 2개 / 3개 이상
      let baseCount = 0;
      let overlapTotal = 0;

      draws.forEach((draw) => {
        const prev = byRound.get(draw.round - 1);
        if (!prev) return;
        baseCount += 1;
        const overlap = draw.numbers.filter((number) => prev.numbers.includes(number)).length;
        overlapTotal += overlap;
        distribution[Math.min(overlap, 3)] += 1;
      });

      // 이론값: 직전 회차 6개 중 하나 이상이 다시 나올 확률 = 1 - C(39,6)/C(45,6)
      const expectedAtLeastOneRate = 1 - (39 * 38 * 37 * 36 * 35 * 34) / (45 * 44 * 43 * 42 * 41 * 40);
      return {
        baseCount,
        averageOverlap: baseCount ? overlapTotal / baseCount : 0,
        atLeastOneRate: baseCount ? (baseCount - distribution[0]) / baseCount : 0,
        expectedAtLeastOneRate,
        distribution,
        latestNumbers: draws[0] ? draws[0].numbers : []
      };
    }

    const NUMBER_ZONES = [[1, 10], [11, 20], [21, 30], [31, 40], [41, 45]];

    function analyzeZoneDistribution(draws, recentLimit = 20) {
      const recentDraws = draws.slice(0, recentLimit);
      const countZones = (list) => {
        const counts = NUMBER_ZONES.map(() => 0);
        list.forEach((draw) => draw.numbers.forEach((number) => {
          counts[NUMBER_ZONES.findIndex(([low, high]) => number >= low && number <= high)] += 1;
        }));
        return counts;
      };
      const overallCounts = countZones(draws);
      const recentCounts = countZones(recentDraws);

      return {
        recentLimit: recentDraws.length,
        zones: NUMBER_ZONES.map(([low, high], index) => ({
          label: `${low}~${high}`,
          expectedPerDraw: (6 * (high - low + 1)) / 45,
          overallPerDraw: draws.length ? overallCounts[index] / draws.length : 0,
          recentPerDraw: recentDraws.length ? recentCounts[index] / recentDraws.length : 0
        }))
      };
    }

    function analyzeNumberGaps(draws) {
      const latestRound = draws[0] ? draws[0].round : 0;
      const lastSeen = new Map();
      draws.forEach((draw) => {
        draw.numbers.forEach((number) => {
          if (!lastSeen.has(number)) lastSeen.set(number, draw.round);
        });
      });

      const gaps = Array.from({ length: 45 }, (_, index) => {
        const number = index + 1;
        const seenRound = lastSeen.get(number);
        return {
          number,
          gap: seenRound === undefined ? draws.length : latestRound - seenRound
        };
      });

      return {
        averageExpectedGap: 45 / 6,
        longestAbsent: [...gaps].sort((a, b) => b.gap - a.gap || a.number - b.number).slice(0, 10)
      };
    }

    function findStatisticalPatterns(draws) {
      return {
        numberFrequency: analyzeNumberFrequencySignificance(draws).slice(0, 12),
        pairCooccurrence: analyzePairCooccurrence(draws),
        structural: analyzeStructuralPatterns(draws),
        lastDigits: analyzeLastDigitPatterns(draws),
        consecutive: analyzeConsecutivePatterns(draws),
        neighborFollowers: analyzeNeighborFollowers(draws),
        carryOver: analyzeCarryOver(draws),
        zoneDistribution: analyzeZoneDistribution(draws),
        numberGaps: analyzeNumberGaps(draws)
      };
    }

    function renderBalls(numbers, bonus = null, highlights = null) {
      const winningNumbers = new Set(highlights?.winningNumbers || []);
      const mainBalls = numbers.map((number) => {
        const highlightClass = winningNumbers.has(number)
          ? " hit"
          : number === highlights?.bonus ? " bonus-hit" : "";
        return `<span class="ball ${getBallClass(number)}${highlightClass}">${number}</span>`;
      }).join("");
      const className = highlights ? "balls scored" : "balls";
      if (!bonus) return `<div class="${className}">${mainBalls}</div>`;
      return `<div class="${className}">${mainBalls}<span class="ball-plus">+</span><span class="ball ${getBallClass(bonus)}">${bonus}</span></div>`;
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat("ko-KR").format(value || 0);
    }

    function formatDateTime(value) {
      if (!value) return "아직 갱신 전";
      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function formatPercent(value) {
      return `${(value * 100).toFixed(1)}%`;
    }

    function safeTopNumbers(items, count = 3) {
      return items.slice(0, count).map((item) => item.number);
    }

    function formatEok(value) {
      return `${((value || 0) / 100000000).toFixed(1)}억원`;
    }

    function createBriefingModel(data, state) {
      const stats = calculateStats(data.draws, state.preferences.statWindow);
      return {
        stats,
        cards: [
          { title: "최근 강세 번호", numbers: safeTopNumbers(stats.hotNumbers, 3) },
          { title: "쉬어가는 번호", numbers: safeTopNumbers(stats.coldNumbers, 3) }
        ],
        followers: analyzeLatestNumberFollowers(data.draws)
      };
    }

    const CURRENT_METHODS = [
      "round-transition",
      "lstm-stateful-ball-weighted-v3",
      "weighted-statistical-v2",
      "walk-forward-backtest-v2"
    ];

    function renderMatchBadge(match) {
      if (!match) return "";
      const tier = getPrizeTier(match.matchCount, match.bonusMatched);
      const won = tier !== "낙첨";
      return `<span class="hit-count${won ? " won" : ""}">${match.matchCount}개${match.bonusMatched ? " + 보너스" : ""}${won ? ` · ${tier}` : ""}</span>`;
    }

    function renderLstmScoreboard(entries) {
      const panel = document.querySelector("#lstmScorePanel");
      const scored = entries.filter((entry) => entry.result && Array.isArray(entry.result.matches));
      if (!scored.length) {
        panel.innerHTML = "";
        return;
      }

      const allMatches = scored.flatMap((entry) => entry.result.matches);
      const averageOf = (matches) => matches.reduce((total, match) => total + match.matchCount, 0) / matches.length;
      const threePlusOf = (matches) => matches.filter((match) => match.matchCount >= 3).length;
      const methodGroups = [...new Set(allMatches.map((match) => match.method))].map((method) => ({
        method, matches: allMatches.filter((match) => match.method === method)
      }));
      const currentGroups = CURRENT_METHODS.map((method) => methodGroups.find((group) => group.method === method)).filter(Boolean);
      const legacyGroups = methodGroups.filter((group) => !CURRENT_METHODS.includes(group.method));
      const bestOf = (matches) => matches.reduce((best, match) => Math.max(best, match.matchCount), 0);

      panel.innerHTML = `
        <div class="section-head">
          <h2>추천 성적표</h2>
          <div class="stat-pills">
            <span class="stat-pill">${scored.length}회차</span>
            <span class="stat-pill">이론 0.80개</span>
            <span class="stat-pill">최고 ${bestOf(allMatches)}개</span>
          </div>
        </div>
        <div class="score-grid">
          ${currentGroups.map((group) => `<div class="score-tile"><span>${methodLabel(group.method)}</span><strong>${averageOf(group.matches).toFixed(2)}</strong><small>${group.matches.length}세트 · 3개 이상 ${threePlusOf(group.matches)}</small></div>`).join("")}
        </div>
        ${legacyGroups.length ? `
          <details class="fold">
            <summary>이전 버전</summary>
            <div class="stat-pills" style="margin-top:10px;">
              ${legacyGroups.map((group) => `<span class="stat-pill">${methodLabel(group.method)} ${averageOf(group.matches).toFixed(2)}개 · ${group.matches.length}세트 · 3개 이상 ${threePlusOf(group.matches)}</span>`).join("")}
            </div>
          </details>` : ""}
        <div class="history-batch-list">
          ${scored.slice(0, 20).map((entry, index) => {
            const result = entry.result;
            return `
              <details class="history-batch"${index ? "" : " open"}>
                <summary>
                  <span class="batch-round">${entry.targetRound}회</span>
                  ${renderBalls(result.winningNumbers, result.bonus)}
                  <span class="stat-pill batch-best">최고 ${bestOf(result.matches)}개</span>
                </summary>
                <div class="score-rows">
                  ${entry.recommendations.map((rec, recIndex) => `
                    <article class="recommendation-card score-row">
                      <span class="rec-label">${methodLabel(rec.method)}</span>
                      ${renderBalls(rec.numbers, null, { winningNumbers: result.winningNumbers, bonus: result.bonus })}
                      ${renderMatchBadge(result.matches[recIndex])}
                    </article>
                  `).join("")}
                </div>
              </details>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderStatus(state, data, loadStatus) {

      panel.classList.toggle("error", Boolean(loadStatus.failed));

    function methodLabel(method) {
      if (method === "uniform") return "균등 무작위";
      if (method === "lstm-stateful-ball-weighted-v3") return "LSTM";
      if (method === "lstm-number-weighted-v2") return "LSTM 번호별 점수 v2";
      if (method === "weighted-statistical-v2") return "통계";
      if (method === "walk-forward-backtest-v2") return "백테스트";

      if (method === "lstm-combination-best") return "LSTM 최고 점수 조합";
      if (method === "lstm-combination-diverse") return "LSTM 다양성 조합";
      if (method === "balanced-statistical") return "통계 균형 조합";
      if (method === "lstm-weighted-selection") return "LSTM 가중 선택 v1";
      if (method === "weighted-statistical") return "통계 가중 선택 v1";

    function renderRecommendationGroup(label, recommendations, tag = "") {
      if (!recommendations.length) return "";
      return `
        <section class="rec-group">
          <h3>${label}${tag}</h3>

            ${recommendations.map((rec) => `<article class="recommendation-card">${renderBalls(rec.numbers)}</article>`).join("")}

        </section>`;
    }

    function renderLstmRecommendations(prediction, data) {
      if (!prediction) return "";
      const isStale = Number(prediction.sourceLatestRound) !== Number(data.latestRound);
      return renderRecommendationGroup("LSTM",
        prediction.recommendations.filter((rec) => rec.method.startsWith("lstm")),
        isStale ? `<span class="stat-pill warn">${prediction.sourceLatestRound}회 기준</span>` : "");
    }

    function renderLstmMetrics(prediction) {
      if (!prediction) return "";
      return `
        <h3>LSTM</h3>
        <div class="stat-pills">
          <span class="stat-pill">학습 ${prediction.sourceLatestRound}회</span>

        </div>
        ${prediction.numberScores ? `
          <details>
            <summary>번호별 점수</summary>
            <div class="table-wrap" tabindex="0" role="region" aria-label="번호별 모델 점수">
              <table>
                <thead><tr><th scope="col">번호</th><th scope="col">모델 점수</th><th scope="col">공 개수</th></tr></thead>
                <tbody>${prediction.numberScores.map((score, index) => ({ number: index + 1, score }))

              </table>

    function renderBacktestRecommendations(prediction) {
      return prediction
        ? renderRecommendationGroup("백테스트", prediction.recommendations.filter((rec) => rec.method.startsWith("walk-forward-backtest")))
        : "";
    }

    function renderBacktestMetrics(prediction) {
      const summary = prediction?.backtest;
      if (!summary) return "";
      const selected = summary.selectedMethod === "uniform"
        ? "균등 무작위"
        : summary.selectedMethod === "frequency-all"
          ? "전체 누적 빈도"
          : summary.selectedMethod === "frequency-window"
            ? `최근 ${summary.selectedWindow}회 빈도`
            : `반감기 ${summary.selectedHalfLife}회 시간감쇠 빈도`;
      return `
        <h3>백테스트</h3>
        <div class="stat-pills">
          <span class="stat-pill">선택 ${selected}</span>
          <span class="stat-pill">평균 ${evaluationNumber(summary.meanMatches)}개</span>
          <span class="stat-pill">무작위 ${evaluationNumber(summary.randomBaseline)}개</span>
          <span class="stat-pill">3개 이상 ${evaluationPercent(summary.threePlusRate)}</span>
          <span class="stat-pill">무작위 대비 95% 구간 ${evaluationInterval(summary.differenceCI95)}</span>
          <span class="stat-pill">평가 ${summary.testedRounds.toLocaleString()}회</span>
        </div>`;
    }

    function renderMethodComparison(prediction) {
      const comparison = prediction?.comparison;
      if (!comparison) return "";
      const methods = comparison.methods.filter((row) =>
        ["uniform", "weighted-statistical-v2", "lstm-number-weighted-v2", "lstm-stateful-ball-weighted-v3"].includes(row?.method));
      return `
        <h3>동일 조건 비교</h3>
        <div class="stat-pills">
          <span class="stat-pill">${evaluationNumber(comparison.testStartRound, 0)}~${evaluationNumber(comparison.testEndRound, 0)}회</span>
          <span class="stat-pill">방식별 ${evaluationNumber(comparison.setsPerMethod, 0)}세트</span>
          <span class="stat-pill">시드 ${evaluationNumber(comparison.seedCount, 0)}개</span>
          <span class="stat-pill">AUC ${evaluationNumber(comparison.testAuc)}</span>
          <span class="stat-pill">Brier ${evaluationNumber(comparison.brierScore, 6)} / 균등 ${evaluationNumber(comparison.uniformBrierScore, 6)}</span>
        </div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="추천 방식별 평가 성적">
          <table>
            <thead><tr><th scope="col">방식</th><th scope="col">평균 적중</th><th scope="col">3개 이상</th><th scope="col">무작위 대비</th><th scope="col">95% 구간</th></tr></thead>
            <tbody>${methods.map((row) => `
              <tr><th scope="row">${methodLabel(row.method)}</th>
                <td>${evaluationNumber(row.meanMatches)}개</td>
                <td>${evaluationPercent(row.threePlusRate)}</td>
                <td>${evaluationNumber(row.differenceVsRandom)}개</td>
                <td>${evaluationInterval(row.differenceCI95)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    const TRANSITION_WARMUP = 200;  // 전이 예측 채점 전에 쌓는 연속 회차 쌍

    function predictTransitionSet(draws) {
      if (draws.length < 2 || !draws.every((draw) => draw && isValidDraw(draw))
        || new Set(draws.map((draw) => draw.round)).size !== draws.length) return null;
      const history = [...draws].sort((a, b) => a.round - b.round);
      const counts = Array.from({ length: 46 }, () => Array(46).fill(0));
      const samples = Array(46).fill(0);
      // 45 virtual transitions at the uniform 6/45 rate soften sparse observations.
      // ponytail: one-step associations only; the walk-forward result below shows no edge, so longer sequences are not justified.
      const pick = (latest) => Array.from({ length: 45 }, (_, index) => {
        const number = index + 1;
        const score = latest.numbers.reduce((sum, previous) =>
          sum + (counts[previous][number] + 6) / (samples[previous] + 45), 0) / 6;
        return { number, score };
      }).sort((a, b) => b.score - a.score || a.number - b.number)
        .slice(0, 6).map((item) => item.number).sort((a, b) => a - b);
      let transitions = 0;
      const matches = [];
      for (let i = 1; i < history.length; i++) {
        if (history[i].round !== history[i - 1].round + 1) continue;
        // 시간순 검증: 이 회차의 전이를 집계하기 전에 고른 번호만 채점한다.
        if (transitions >= TRANSITION_WARMUP) {
          matches.push(pick(history[i - 1]).filter((number) => history[i].numbers.includes(number)).length);
        }
        transitions++;
        for (const previous of history[i - 1].numbers) {
          samples[previous]++;
          for (const next of history[i].numbers) counts[previous][next]++;
        }
      }
      if (!transitions) return null;
      const latest = history[history.length - 1];
      const mean = matches.length ? sumNumbers(matches) / matches.length : null;
      // ponytail: 회차 단위 정규근사 구간; 회차 의존성을 분석할 때 block bootstrap으로 교체.
      const margin = matches.length < 2 ? null : 1.96 * Math.sqrt(
        matches.reduce((total, count) => total + (count - mean) ** 2, 0) / (matches.length - 1) / matches.length);
      return {
        sourceLatestRound: latest.round,
        targetRound: latest.round + 1,
        transitions,
        numbers: pick(latest),
        evaluation: {
          warmupTransitions: TRANSITION_WARMUP,
          testedRounds: matches.length,
          meanMatches: mean,
          threePlusRate: matches.length ? matches.filter((count) => count >= 3).length / matches.length : null,
          differenceCI95: margin === null ? null : [mean - 0.8 - margin, mean - 0.8 + margin]
        }
      };
    }

    function renderRecommendations(state, data) {
      const panel = document.querySelector("#recommendPanel");
      if (data.draws.length === 0) {
        panel.innerHTML = "";
        return;
      }

      const statRecs = lstmPrediction
        ? lstmPrediction.recommendations.filter((rec) =>
            !rec.method.startsWith("lstm")
            && !rec.method.startsWith("walk-forward-backtest")
          )
        : [];
      const transition = predictTransitionSet(data.draws);
      const sets = (lstmPrediction?.recommendations || []).map((rec) => new Set(rec.numbers));
      if (transition) sets.push(new Set(transition.numbers));
      const maxShared = sets.length > 1 ? Math.max(...sets.flatMap((set, index) =>
        sets.slice(index + 1).map((other) => [...set].filter((n) => other.has(n)).length))) : 0;
      const targetRound = transition?.targetRound || lstmPrediction?.targetRound;
      const evaluation = transition?.evaluation;
      panel.innerHTML = `
        <div class="section-head">
          <h2>${targetRound ? `${targetRound}회 ` : ""}추천 번호</h2>
          <span class="stat-pill">전체 ${sets.length}세트</span>
        </div>
        <div>
          ${transition ? renderRecommendationGroup("회차 전이", [transition]) : ""}
          ${renderLstmRecommendations(lstmPrediction, data)}
          ${renderRecommendationGroup("통계", statRecs)}
          ${renderBacktestRecommendations(lstmPrediction)}
        </div>
        <details class="fold">
          <summary>검증 지표</summary>
          <h3>전체</h3>
          <div class="stat-pills">
            <span class="stat-pill">서로 다른 번호 ${new Set(sets.flatMap((set) => [...set])).size}개</span>
            <span class="stat-pill">최대 겹침 ${maxShared}개</span>
          </div>
          ${evaluation?.differenceCI95 ? `
            <h3>회차 전이</h3>
            <div class="stat-pills">
              <span class="stat-pill">평균 ${evaluationNumber(evaluation.meanMatches)}개</span>
              <span class="stat-pill">3개 이상 ${evaluationPercent(evaluation.threePlusRate)}</span>
              <span class="stat-pill">이론 대비 차이 95% 구간 ${evaluationInterval(evaluation.differenceCI95)}</span>
              <span class="stat-pill">평가 ${evaluation.testedRounds.toLocaleString()}회</span>
            </div>` : ""}
          ${renderLstmMetrics(lstmPrediction)}
          ${renderBacktestMetrics(lstmPrediction)}
          ${renderMethodComparison(lstmPrediction)}
        </details>
      `;
    }

    function renderMiniBars(items, max, labeler) {
      return `<div class="mini-bars">${items.map((item) => `
        <div class="mini-bar">
          <strong>${labeler(item)}</strong>
          <div class="bar-track"><div class="bar-fill" style="width:${max ? (item.count / max) * 100 : 0}%"></div></div>
          <span>${item.count}회</span>
        </div>
      `).join("")}</div>`;
    }

    function renderKeyValues(rows) {
      return `<dl class="kv">${rows.map(([key, value]) => `<div><dt>${key}</dt><dd>${value}</dd></div>`).join("")}</dl>`;
    }

    function renderStats(data) {
      const panel = document.querySelector("#statsPanel");
      if (data.draws.length === 0) {
        panel.innerHTML = "";
        return;
      }

      const stats = calculateStats(data.draws, appState.preferences.statWindow);
      const hotMax = Math.max(...stats.hotNumbers.map((item) => item.count), 1);
      const coldMax = Math.max(...stats.coldNumbers.map((item) => item.count), 1);
      panel.innerHTML = `
        <div class="section-head">
          <h2>통계 개요</h2>
          <span class="stat-pill">최근 ${Math.min(appState.preferences.statWindow, data.draws.length)}회</span>
        </div>
        <div class="grid">
          <div class="metric"><h3>평균 홀짝</h3><p class="metric-value">${stats.averageOdd.toFixed(1)}:${stats.averageEven.toFixed(1)}</p></div>
          <div class="metric"><h3>평균 저고</h3><p class="metric-value">${stats.averageLow.toFixed(1)}:${stats.averageHigh.toFixed(1)}</p></div>
          <div class="metric"><h3>합계 평균</h3><p class="metric-value">${stats.averageSum.toFixed(1)}</p><p class="muted">${stats.minSum}~${stats.maxSum}</p></div>
        </div>
        <div class="grid">
          <div class="metric"><h3>자주 나온 번호 TOP 10</h3>${renderMiniBars(stats.hotNumbers, hotMax, (item) => `${item.number}번`)}</div>
          <div class="metric"><h3>덜 나온 번호 TOP 10</h3>${renderMiniBars(stats.coldNumbers, coldMax, (item) => `${item.number}번`)}</div>
        </div>
      `;
    }

    function renderFollowerStats(data) {
      const panel = document.querySelector("#followerStatsPanel");
      if (data.draws.length === 0) {
        panel.innerHTML = "";
        return;
      }

      const analyses = analyzeLatestNumberFollowers(data.draws);
      panel.innerHTML = `
        <div class="section-head">
          <h2>최신 번호의 다음 회차 통계</h2>
        </div>
        <div class="latest-follow-grid">
          ${analyses.map((analysis) => {
            const hotMax = Math.max(...analysis.topNextNumbers.map((item) => item.count), 1);
            return `
              <article class="latest-follow-card">
                <div class="follow-head">
                  <span class="ball ${getBallClass(analysis.number)}">${analysis.number}</span>
                  <h3>다음 회차</h3>
                  <span class="stat-pill">${analysis.sampleCount ? `표본 ${analysis.sampleCount}` : "표본 부족"}</span>
                </div>
                ${analysis.sampleCount ? `
                  ${renderMiniBars(analysis.topNextNumbers, hotMax, (item) => `${item.number}번`)}
                  <div class="stat-pills">
                    <span class="stat-pill">합계 ${analysis.stats.averageSum.toFixed(1)}</span>
                    <span class="stat-pill">홀짝 ${analysis.stats.averageOdd.toFixed(1)}:${analysis.stats.averageEven.toFixed(1)}</span>
                    <span class="stat-pill">저고 ${analysis.stats.averageLow.toFixed(1)}:${analysis.stats.averageHigh.toFixed(1)}</span>
                    <span class="stat-pill">재등장 ${analysis.repeatedLatestNumbers.join(", ") || "없음"}</span>
                  </div>
                ` : ""}
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderSignificancePanel(data) {
      const panel = document.querySelector("#significancePanel");
      if (data.draws.length === 0) {
        panel.innerHTML = "";
        return;
      }
      const patterns = findStatisticalPatterns(data.draws);
      const frequencyMax = Math.max(...patterns.numberFrequency.map((item) => item.observed), 1);
      const digitMax = Math.max(...patterns.lastDigits.digits.map((item) => item.recentCount), 1);
      const neighborMax = Math.max(...patterns.neighborFollowers.topNeighbors.map((item) => item.count), 1);
      const { consecutive, structural, carryOver, neighborFollowers } = patterns;
      const shareOfDraws = (count) => formatPercent(data.draws.length ? count / data.draws.length : 0);
      const bar = (label, width, value) => `
        <div class="mini-bar">
          <strong>${label}</strong>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <span>${value}</span>
        </div>`;

      panel.innerHTML = `
        <div class="section-head">
          <h2>세부 통계</h2>
        </div>
        <div class="grid">
          <div class="metric">
            <h3>번호 출현 편차</h3>
            <div class="mini-bars">${patterns.numberFrequency.map((item) =>
              bar(`${item.number}번`, (item.observed / frequencyMax) * 100, `${item.observed}회 · ${item.label}`)).join("")}</div>
          </div>
          <div class="metric">
            <h3>번호 쌍 동시 출현</h3>
            ${patterns.pairCooccurrence.length
              ? renderKeyValues(patterns.pairCooccurrence.map((item) => [item.pair.join("-"), `${item.observed}회 · ${item.label}`]))
              : `<span class="stat-pill">표본 부족</span>`}
          </div>
        </div>
        <div class="grid">
          <div class="metric">
            <h3>이웃수(±1) 패턴</h3>
            ${renderKeyValues([
              ["기준 회차", `${neighborFollowers.baseCount}개`],
              ["다음 회차 등장", `${neighborFollowers.matchedNextDrawCount}회 (${formatPercent(neighborFollowers.hitRate)})`]
            ])}
            ${neighborFollowers.topNeighbors.length ? `
              <div class="mini-bars">${neighborFollowers.topNeighbors.map((item) =>
                bar(`${item.number}번`, (item.count / neighborMax) * 100, `${item.count}회`)).join("")}</div>
            ` : ""}
          </div>
          <div class="metric">
            <h3>끝수 패턴 (최근 5회)</h3>
            <div class="mini-bars">${patterns.lastDigits.digits.map((item) =>
              bar(`${item.digit}끝`, digitMax ? (item.recentCount / digitMax) * 100 : 0, `${item.recentCount}회 · ${formatPercent(item.recentShare)}`)).join("")}</div>
            <div class="stat-pills">${patterns.lastDigits.recentStrongDigits.map((item) => `<span class="stat-pill">${item.digit}끝 ${formatPercent(item.delta)}</span>`).join("")}</div>
          </div>
          <div class="metric">
            <h3>연번 등장 확률</h3>
            ${renderKeyValues([
              ["이번 회차 추정", formatPercent(consecutive.estimatedNextRate)],
              ["전체 회차", formatPercent(consecutive.overallTwoPlusRate)],
              [`최근 ${consecutive.recentLimit}회`, formatPercent(consecutive.recentTwoPlusRate)],
              ["최근 흐름 배수", consecutive.trendRatio ? `${consecutive.trendRatio.toFixed(2)}배` : "-"],
              ["3연번 이상", shareOfDraws(consecutive.summary.threePlus)],
              ["4연번 이상", shareOfDraws(consecutive.summary.fourPlus)]
            ])}
          </div>
          <div class="metric">
            <h3>합계 구조</h3>
            ${renderKeyValues([
              ["합계 평균", structural.averageSum.toFixed(1)],
              ["합계 범위", `${structural.minSum}~${structural.maxSum}`],
              ["연번 포함률", formatPercent(structural.consecutiveRate)]
            ])}
          </div>
        </div>
        <div class="grid">
          <div class="metric">
            <h3>이월수</h3>
            ${renderKeyValues([
              ["1개 이상 재출현", `${formatPercent(carryOver.atLeastOneRate)} (이론 ${formatPercent(carryOver.expectedAtLeastOneRate)})`],
              ["평균 겹침", `${carryOver.averageOverlap.toFixed(2)}개 (이론 0.80개)`],
              ["0개", `${carryOver.distribution[0]}회`],
              ["1개", `${carryOver.distribution[1]}회`],
              ["2개", `${carryOver.distribution[2]}회`],
              ["3개 이상", `${carryOver.distribution[3]}회`]
            ])}
            ${carryOver.latestNumbers.length ? renderBalls(carryOver.latestNumbers) : ""}
          </div>
          <div class="metric">
            <h3>구간 분포 (최근 ${patterns.zoneDistribution.recentLimit}회)</h3>
            <div class="mini-bars">${patterns.zoneDistribution.zones.map((zone) =>
              bar(zone.label, Math.min(100, (zone.recentPerDraw / 6) * 100 * 3),
                `${zone.recentPerDraw.toFixed(2)} · 전체 ${zone.overallPerDraw.toFixed(2)} · 이론 ${zone.expectedPerDraw.toFixed(2)}`)).join("")}</div>
          </div>
          <div class="metric">
            <h3>미출현 기간</h3>
            <div class="mini-bars">${patterns.numberGaps.longestAbsent.map((item) =>
              bar(`${item.number}번`, Math.min(100, (item.gap / 30) * 100), `${item.gap}회`)).join("")}</div>
          </div>
        </div>
      `;
    }

    function renderHistory(state, data) {
      const query = String(state.preferences.historyQuery || "").trim();
      const limit = Number(state.preferences.historyLimit || 50);
      const filtered = data.draws
        .filter((draw) => !query || String(draw.round).includes(query) || draw.date.includes(query))
        .slice(0, limit);

      document.querySelector("#historyPanel").innerHTML = `
        <h2>역대 당첨번호</h2>
        <div class="form-row" style="margin-bottom:12px;">
          <input id="historyQuery" type="search" placeholder="회차 또는 날짜 검색" value="${query}">
          <select id="historyLimit" aria-label="표시 개수">
            ${[20, 50, 100, 300, 1000].map((value) => `<option value="${value}" ${value === limit ? "selected" : ""}>${value}개</option>`).join("")}
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>회차</th><th>날짜</th><th>번호</th><th>보너스</th><th>1등</th><th>1등 당첨금</th></tr></thead>
            <tbody>
              ${filtered.map((draw) => `
                <tr>
                  <td>${draw.round}</td>
                  <td>${draw.date || "-"}</td>
                  <td>${renderBalls(draw.numbers)}</td>
                  <td>${renderBalls([draw.bonus])}</td>
                  <td>${draw.firstWinnerCount}명</td>
                  <td>${formatCurrency(draw.firstPrizeAmount)}원</td>
                </tr>
              `).join("") || "<tr><td colspan=\"6\">표시할 회차가 없습니다.</td></tr>"}
            </tbody>
          </table>
        </div>
      `;

      document.querySelector("#historyQuery").addEventListener("input", (event) => {
        appState = saveState({
          ...appState,
          preferences: { ...appState.preferences, historyQuery: event.target.value }
        });
        renderHistory(appState, drawData);
      });
      document.querySelector("#historyLimit").addEventListener("change", (event) => {
        appState = saveState({
          ...appState,
          preferences: { ...appState.preferences, historyLimit: Number(event.target.value) }
        });
        renderHistory(appState, drawData);
      });
    }

    function renderApp(state, data, loadStatus) {
      currentLoadStatus = loadStatus;
      renderStatus(state, data, loadStatus);
      renderLatest(data);
      renderBriefing(data, state);
      renderRecommendations(state, data);
      renderLstmScoreboard(lstmHistory);
      renderStats(data);
      renderFollowerStats(data);
      renderSignificancePanel(data);
      renderHistory(state, data);
    }

    async function loadAppData() {
      const button = document.querySelector("#refreshButton");
      button.disabled = true;
      renderApp(appState, drawData, { title: "데이터 로딩 중" });

      try {
        drawData = await loadDrawData();
        lstmPrediction = await loadLstmPrediction();
        lstmHistory = await loadLstmHistory();
        renderApp(appState, drawData, { title: "데이터 로드 완료" });
      } catch (error) {
        console.warn("data_load_failed", error);
        renderApp(appState, drawData, {
          failed: true,
          message: "lotto-data.json을 읽지 못했습니다. 파일이 있는지 확인하고, 필요하면 이 폴더를 로컬 서버로 열어주세요."
        });
      } finally {
        button.disabled = false;
      }
    }

    function showView(viewName) {
      const targetView = document.querySelector(`#${viewName}View`);
      const targetButton = document.querySelector(`.tab-button[data-view="${viewName}"]`);
      if (!targetView || !targetButton) return;

      document.querySelectorAll(".tab-button").forEach((button) => {
        const isActive = button === targetButton;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      document.querySelectorAll(".view").forEach((view) => {
        const isActive = view === targetView;
        view.classList.toggle("active", isActive);
        view.hidden = !isActive;
      });
    }

    document.querySelector("#refreshButton").addEventListener("click", loadAppData);

    document.querySelector(".view-tabs").addEventListener("click", (event) => {
      const button = event.target.closest(".tab-button");
      if (!button) return;
      showView(button.dataset.view);
    });

    document.addEventListener("DOMContentLoaded", () => {
      showView(document.querySelector(".tab-button.active")?.dataset.view || "dashboard");
      renderApp(appState, drawData, currentLoadStatus);
      loadAppData();
    });
  </script>
</body>
</html>
